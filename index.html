<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My GitHub Website</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20392e;
        --muted: #687b70;
        --accent: #356b4b;
        --accent-dark: #28543a;
        --surface: #fffefa;
        --page: #eef3eb;
        --soft: #e1ecdf;
        --border: #d8e3d5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at top left, #dce9d9 0, transparent 42%),
          var(--page);
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 620px);
        margin: 0 auto;
      }

      header {
        margin: 0 auto 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(2rem, 6vw, 2.8rem);
        letter-spacing: -0.04em;
      }

      p,
      label {
        color: var(--muted);
      }

      header > p:last-child {
        margin: 12px 0 0;
        font-size: 1.05rem;
      }

      #person-choice,
      #mood-options,
      #follow-up,
      #other-check-in,
      #response {
        margin: 16px 0;
        padding: 26px;
        border: 1px solid rgba(216, 227, 213, 0.9);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 12px 36px rgba(38, 75, 49, 0.08);
      }

      #evan-note {
        display: none;
        margin: -14px 0 20px;
        color: var(--accent-dark);
        font-size: 1.05rem;
        font-weight: 600;
      }

      #person-choice > p,
      #mood-options legend {
        margin: 0 0 16px;
        color: var(--ink);
        font-size: 1.12rem;
        font-weight: 650;
      }

      button {
        min-height: 44px;
        padding: 11px 22px;
        border: 0;
        border-radius: 12px;
        background-color: var(--accent);
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        background-color: var(--accent-dark);
        box-shadow: 0 5px 14px rgba(40, 84, 58, 0.2);
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #a7c9a8;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #start-button,
      #mood-options,
      #response,
      #follow-up,
      #other-check-in {
        display: none;
      }

      #start-button {
        margin: 8px 0;
      }

      #mood-options fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }

      #word-step {
        display: none;
      }

      #word-step fieldset {
        display: flex;
        width: 100%;
        min-width: 0;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 0 0 20px;
        padding: 0;
        border: 0;
      }

      #word-step legend {
        flex: 1 0 100%;
        margin: 0 0 14px;
        color: var(--ink);
        font-size: 1.12rem;
        font-weight: 650;
        text-align: center;
      }

      #word-audio-status {
        min-height: 1.4em;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      #word-step .word-option {
        position: relative;
        display: flex;
        flex: 0 1 100px;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fbfcf8;
        color: var(--ink);
        font-weight: 650;
        cursor: pointer;
      }

      #word-step .word-option:has(input:checked) {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent-dark);
      }

      #word-step .word-option input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      #word-step .word-option:focus-within {
        outline: 3px solid #a7c9a8;
        outline-offset: 3px;
      }

      #mood-options legend {
        width: 100%;
      }

      .mood-scale {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0 4px;
      }

      .mood-scale label {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fbfcf8;
        color: var(--ink);
        font-weight: 700;
        cursor: pointer;
        transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
      }

      .mood-scale label:has(input:checked) {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent-dark);
      }

      .mood-scale input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      #response {
        margin-bottom: 16px;
        color: var(--accent-dark);
        font-size: 1.05rem;
        font-weight: 650;
      }

      #follow-up {
        text-align: left;
      }

      #message-step {
        display: none;
      }

      #follow-up label {
        display: block;
        margin: 0 0 8px;
        color: var(--ink);
        font-weight: 650;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 100px;
        margin: 0 0 20px;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fbfcf8;
        color: var(--ink);
        font: inherit;
        line-height: 1.5;
        resize: vertical;
      }

      textarea::placeholder {
        color: #8b978d;
      }

      #follow-up button {
        width: 100%;
      }

      #thank-you {
        margin: 14px 0 0;
        text-align: center;
      }

      #other-check-in {
        text-align: left;
      }

      #other-check-in h2 {
        margin: 0 0 18px;
        color: var(--ink);
        font-size: 1.3rem;
      }

      .answer-card {
        margin: 12px 0;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f6f9f3;
      }

      .answer-card[hidden] {
        display: none;
      }

      .answer-label {
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .answer-card p {
        margin: 0;
        color: var(--ink);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      #selected-word-summary {
        margin: 0 0 22px;
        padding: 13px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f6f9f3;
        color: var(--accent-dark);
        font-weight: 650;
        text-align: center;
      }

      #other-check-in-message-card {
        border-left: 3px solid #78a47f;
        background: #f3f7ef;
      }

      #other-check-in-message {
        white-space: pre-line;
      }

      #other-check-in-date {
        margin-top: 18px;
        font-size: 0.86rem;
        text-align: center;
      }

      .poppo-controls {
        margin: 4px 0 20px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f3f7ef;
        text-align: center;
      }

      .poppo-controls p {
        margin: 0 0 10px;
        color: var(--ink);
        font-weight: 650;
      }

      #poppo-button {
        width: auto;
        min-width: 130px;
        background: #557c43;
      }

      #poppo-status {
        min-height: 1.5em;
        margin: 10px 0 0;
        color: var(--accent-dark);
        font-size: 0.93rem;
        font-weight: 650;
      }

      @media (max-width: 480px) {
        body {
          padding: 30px 14px;
        }

        #person-choice,
        #mood-options,
        #follow-up,
        #other-check-in,
        #response {
          padding: 21px 17px;
          border-radius: 17px;
        }

        .mood-scale {
          gap: 7px;
        }

        .mood-scale label {
          width: 48px;
          height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hellooew!</h1>
        <p>Tell me how your day has been.</p>
        <p id="evan-note" aria-live="polite"></p>
      </header>

      <section id="person-choice">
        <p>Who is filling out the check-in?</p>
        <button onclick="choosePerson('Emily')">Emily</button>
        <button onclick="choosePerson('Evan')">Evan</button>
      </section>

      <p id="selected-person" aria-live="polite"></p>
      <button id="start-button" onclick="showMoodOptions()">Start check-in</button>
      <div id="mood-options">
        <fieldset>
          <legend>On a scale of 1 to 5, how is your mood? (5 is the best)</legend>
          <div class="mood-scale">
            <label><input type="radio" name="mood-rating" value="1" onchange="showResponse(this.value)">1</label>
            <label><input type="radio" name="mood-rating" value="2" onchange="showResponse(this.value)">2</label>
            <label><input type="radio" name="mood-rating" value="3" onchange="showResponse(this.value)">3</label>
            <label><input type="radio" name="mood-rating" value="4" onchange="showResponse(this.value)">4</label>
            <label><input type="radio" name="mood-rating" value="5" onchange="showResponse(this.value)">5</label>
          </div>
        </fieldset>
      </div>
      <p id="response" aria-live="polite"></p>
      <div id="follow-up">
        <div id="description-step">
          <label id="follow-up-question" for="day-input"></label>
          <textarea id="day-input" placeholder="Type your answer here"></textarea>
          <button id="description-submit-button" type="button" onclick="continueToWord()">
            Submit day description
          </button>
        </div>
        <div id="word-step">
          <fieldset>
            <legend>Which do you resonate most with today?</legend>
            <label class="word-option"><input type="radio" name="word-of-day" value="Ben" onchange="playWordAudio(this.value)">Ben</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Yers" onchange="playWordAudio(this.value)">Yers</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Noew" onchange="playWordAudio(this.value)">Noew</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Beso" onchange="playWordAudio(this.value)">Beso</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Poppo" onchange="playWordAudio(this.value)">Poppo</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Sternie" onchange="playWordAudio(this.value)">Sternie</label>
            <label class="word-option"><input type="radio" name="word-of-day" value="Eyes" onchange="playWordAudio(this.value)">Eyes</label>
          </fieldset>
          <p id="word-audio-status" aria-live="polite"></p>
          <button type="button" onclick="continueToMessage()">Continue</button>
        </div>
        <div id="message-step">
          <p id="selected-word-summary" aria-live="polite"></p>
          <label id="message-question" for="message-input"></label>
          <textarea id="message-input" placeholder="Write a little message (optional)"></textarea>
          <div class="poppo-controls">
            <p id="poppo-instruction"></p>
            <button id="poppo-button" type="button" onclick="sendPoppo()">Poppo 💚</button>
            <p id="poppo-status" aria-live="polite"></p>
          </div>
          <button id="submit-button" onclick="submitAnswer()">Submit check-in</button>
        </div>
        <p id="thank-you" aria-live="polite"></p>
      </div>
      <section id="other-check-in" aria-live="polite">
        <h2 id="other-check-in-heading"></h2>
        <div id="other-check-in-mood-card" class="answer-card">
          <div class="answer-label">Mood</div>
          <p id="other-check-in-mood"></p>
        </div>
        <div id="other-check-in-answer-card" class="answer-card">
          <div class="answer-label">How was your day?</div>
          <p id="other-check-in-answer"></p>
        </div>
        <div id="other-check-in-word-card" class="answer-card">
          <div class="answer-label">Word of the day</div>
          <p id="other-check-in-word"></p>
        </div>
        <div id="other-check-in-message-card" class="answer-card">
          <div class="answer-label">Message &amp; Poppo</div>
          <p id="other-check-in-message"></p>
        </div>
        <p id="other-check-in-date"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Replace these with the Project URL and publishable/anon key from your Supabase project.
      const SUPABASE_URL = "https://xbpngswyyjrdbonexfxy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_O06OF-pRhlmjYEVTfGg7pQ_rqfMxbuQ";

      const supabaseConfigured =
        SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes("YOUR_") &&
        !SUPABASE_ANON_KEY.includes("YOUR_");
      const supabaseClient = supabaseConfigured && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;
      const CHECK_IN_VISIBILITY_MS = 12 * 60 * 60 * 1000;
      const wordAudio = {
        Ben: new Audio("audio/yers.mp3"),
        Yers: new Audio("audio/ben.mp3"),
        Noew: new Audio("audio/noew.mp3"),
        Beso: new Audio("audio/beso.mp3"),
        Poppo: new Audio("audio/poppo.mp3"),
        Sternie: new Audio("audio/sternie.mp3"),
        Eyes: new Audio("audio/eyes.mp3")
      };
      let currentPerson = "";
      let currentMood = "";
      let currentRating = 0;
      let currentAnswer = "";
      let currentWordOfDay = "";
      let currentAudio = null;
      let poppoCount = 0;
      let otherCheckInExpiryTimer = null;

      function clearOtherCheckInExpiryTimer() {
        if (otherCheckInExpiryTimer !== null) {
          window.clearTimeout(otherCheckInExpiryTimer);
          otherCheckInExpiryTimer = null;
        }
      }

      function hideExpiredOtherCheckIn() {
        document.getElementById("other-check-in-mood-card").hidden = false;
        document.getElementById("other-check-in-mood").textContent =
          "No check-in from them in the past 12 hours.";
        document.getElementById("other-check-in-answer").textContent = "";
        document.getElementById("other-check-in-answer-card").hidden = true;
        document.getElementById("other-check-in-word").textContent = "";
        document.getElementById("other-check-in-word-card").hidden = true;
        document.getElementById("other-check-in-message").textContent = "";
        document.getElementById("other-check-in-message-card").hidden = true;
        document.getElementById("other-check-in-date").textContent = "";
        otherCheckInExpiryTimer = null;
      }

      function choosePerson(person) {
        currentPerson = person;
        clearOtherCheckInExpiryTimer();
        const evanNote = document.getElementById("evan-note");
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const scheduleStart = new Date(2026, 9, 8);
        const scheduleEnd = new Date(2026, 10, 1);

        evanNote.style.display = "none";
        evanNote.textContent = "";
        if (person === "Evan" && today >= scheduleStart && today <= scheduleEnd) {
          if (now.getDay() === 3 || now.getDay() === 6) {
            evanNote.textContent =
              "Emily wishes you luck at your game... She is always proud of you.";
          } else {
            const practiceTense = now.getHours() < 12 ? "have" : "had";
            evanNote.textContent = "Emily hopes you " + practiceTense + " a good practice!";
          }
          evanNote.style.display = "block";
        }
        document.getElementById("selected-person").textContent =
          "Filling out the check-in as " + person + ".";
        document.getElementById("start-button").style.display = "inline-block";
        document.getElementById("mood-options").style.display = "none";
        document.getElementById("response").style.display = "none";
        document.getElementById("follow-up").style.display = "none";
        document.getElementById("other-check-in").style.display = "none";
        document.getElementById("thank-you").textContent = "";
      }

      function showMoodOptions() {
        clearOtherCheckInExpiryTimer();
        currentAnswer = "";
        currentWordOfDay = "";
        document.querySelectorAll('input[name="mood-rating"]').forEach((input) => {
          input.checked = false;
        });
        document.getElementById("mood-options").style.display = "block";
        document.getElementById("response").style.display = "none";
        document.getElementById("follow-up").style.display = "none";
        document.getElementById("other-check-in").style.display = "none";
      }

      function showResponse(ratingValue) {
        clearOtherCheckInExpiryTimer();
        currentRating = Number(ratingValue);
        currentAnswer = "";
        currentWordOfDay = "";
        currentMood = currentRating <= 2 ? "bad" : currentRating >= 4 ? "good" : "neutral";
        const response = document.getElementById("response");
        const question = document.getElementById("follow-up-question");
        const thankYou = document.getElementById("thank-you");

        if (currentRating <= 2) {
          response.textContent = "I’m sorry you’re feeling bad. I hope things get better soon!";
          question.textContent = "Can you tell me what made your day bad?";
        } else if (currentRating >= 4) {
          response.textContent = "I’m glad you’re feeling good!";
          question.textContent = "What made your day good today?";
        } else {
          response.textContent = "Thanks for checking in.";
          question.textContent = "Can you describe the good and bad parts of your day today?";
        }

        document.getElementById("message-question").textContent =
          "Message for " + (currentPerson === "Emily" ? "Evan" : "Emily") + " (optional):";
        poppoCount = 0;
        document.getElementById("poppo-instruction").textContent = "Tap to send a Poppo";
        document.getElementById("poppo-status").textContent = "";
        response.style.display = "block";
        document.getElementById("follow-up").style.display = "block";
        document.getElementById("day-input").value = "";
        document.getElementById("message-input").value = "";
        document.getElementById("description-step").style.display = "block";
        document.getElementById("word-step").style.display = "none";
        document.getElementById("message-step").style.display = "none";
        document.querySelectorAll('input[name="word-of-day"]').forEach((input) => {
          input.checked = false;
        });
        document.getElementById("other-check-in").style.display = "none";
        thankYou.textContent = "";
      }

      function continueToWord() {
        const answer = document.getElementById("day-input").value.trim();
        const thankYou = document.getElementById("thank-you");

        if (!answer) {
          thankYou.textContent = "Please describe your day before continuing.";
          return;
        }

        currentAnswer = answer;
        thankYou.textContent = "";
        document.getElementById("description-step").style.display = "none";
        document.getElementById("word-step").style.display = "block";
      }

      function playWordAudio(word) {
        const audio = wordAudio[word];
        const status = document.getElementById("word-audio-status");

        status.textContent = "";
        if (!audio) {
          if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
          }
          return;
        }

        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        currentAudio = audio;
        audio.currentTime = 0;
        audio.play().catch(() => {
          status.textContent = "Couldn't play that audio. Check the MP3 file and try again.";
        });
      }

      function continueToMessage() {
        const selectedWord = document.querySelector('input[name="word-of-day"]:checked');
        const thankYou = document.getElementById("thank-you");

        if (!selectedWord) {
          thankYou.textContent = "Please choose the word you resonate with today.";
          return;
        }

        currentWordOfDay = selectedWord.value;
        document.getElementById("selected-word-summary").textContent =
          "Your word of the day is: " + currentWordOfDay;
        thankYou.textContent = "";
        document.getElementById("word-step").style.display = "none";
        document.getElementById("message-step").style.display = "block";
      }

      function sendPoppo() {
        poppoCount += 1;
        const countText = poppoCount + " Poppo";
        document.getElementById("poppo-instruction").textContent = "Send " + countText;
        document.getElementById("poppo-status").textContent = "Sent " + countText + "!";
      }

      async function submitAnswer() {
        const message = document.getElementById("message-input").value.trim();
        const thankYou = document.getElementById("thank-you");
        const submitButton = document.getElementById("submit-button");

        if (!currentAnswer) {
          thankYou.textContent = "Please submit your day description first.";
          return;
        }

        if (!supabaseConfigured) {
          thankYou.textContent = "Connect Supabase first. Follow the setup steps in README.md.";
          return;
        }

        if (!supabaseClient) {
          thankYou.textContent =
            "The Supabase library did not load. Check your internet connection and refresh.";
          return;
        }

        submitButton.disabled = true;
        thankYou.textContent = "Saving your check-in…";

        try {
          const { error: saveError } = await supabaseClient
            .from("check_ins")
            .insert({
              person: currentPerson,
              mood: currentMood,
              rating: currentRating,
              answer: currentAnswer,
              word_of_day: currentWordOfDay,
              message,
              poppo_count: poppoCount
            });

          if (saveError) {
            throw saveError;
          }

          thankYou.textContent = "Thanks for sharing. Your check-in has been saved.";
          try {
            await showOtherPersonCheckIn();
          } catch (error) {
            thankYou.textContent =
              "Your check-in was saved, but the other person's check-in could not be loaded: " +
              error.message;
          }
        } catch (error) {
          thankYou.textContent = "Could not save your check-in: " + error.message;
        } finally {
          submitButton.disabled = false;
        }
      }

      async function showOtherPersonCheckIn() {
        const otherPerson = currentPerson === "Emily" ? "Evan" : "Emily";
        const { data, error } = await supabaseClient
          .from("check_ins")
          .select("person, mood, rating, answer, word_of_day, message, poppo_count, created_at")
          .eq("person", otherPerson)
          .gte(
            "created_at",
            new Date(Date.now() - CHECK_IN_VISIBILITY_MS).toISOString()
          )
          .order("created_at", { ascending: false })
          .limit(1)
          .maybeSingle();

        if (error) {
          throw error;
        }

        const section = document.getElementById("other-check-in");
        clearOtherCheckInExpiryTimer();
        document.getElementById("other-check-in-heading").textContent =
          otherPerson + "’s latest check-in";

        if (!data) {
          document.getElementById("other-check-in-mood-card").hidden = false;
          document.getElementById("other-check-in-mood").textContent =
            "No check-in from them in the past 12 hours.";
          document.getElementById("other-check-in-answer").textContent = "";
          document.getElementById("other-check-in-answer-card").hidden = true;
          document.getElementById("other-check-in-word").textContent = "";
          document.getElementById("other-check-in-word-card").hidden = true;
          document.getElementById("other-check-in-message").textContent = "";
          document.getElementById("other-check-in-message-card").hidden = true;
          document.getElementById("other-check-in-date").textContent = "";
        } else {
          document.getElementById("other-check-in-mood-card").hidden = false;
          document.getElementById("other-check-in-mood").textContent =
            data.rating
              ? data.rating + " out of 5"
              : data.mood;
          document.getElementById("other-check-in-answer-card").hidden = false;
          document.getElementById("other-check-in-answer").textContent =
            data.answer;
          document.getElementById("other-check-in-word-card").hidden = false;
          document.getElementById("other-check-in-word").textContent =
            data.word_of_day || "No word was selected.";
          const messageLines = [];
          if (data.message) {
            messageLines.push(data.message);
          }
          if (data.poppo_count > 0) {
            messageLines.push(data.person + " sent you " + data.poppo_count + " Poppo!");
          }
          document.getElementById("other-check-in-message-card").hidden = false;
          document.getElementById("other-check-in-message").textContent =
            messageLines.length > 0 ? messageLines.join("\n") : "No message this time.";
          document.getElementById("other-check-in-date").textContent =
            "Submitted: " + new Date(data.created_at).toLocaleString();
          const expiresIn =
            new Date(data.created_at).getTime() + CHECK_IN_VISIBILITY_MS - Date.now();
          otherCheckInExpiryTimer = window.setTimeout(
            hideExpiredOtherCheckIn,
            Math.max(0, expiresIn)
          );
        }

        section.style.display = "block";
      }
    </script>
  </body>
</html>
